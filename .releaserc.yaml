branches: [
    'main',
  {
    name: 'develop',
    prerelease: true
  }
]
ci: true
debug: true
dryRun: false
tagFormat: '${version}'

# Global plugin options (will be passed to all plugins)
preset: 'conventionalcommits'

# Responsible for verifying conditions necessary to proceed with the release:
# configuration is correct, authentication token are valid, etc...
verifyConditions:
  - '@semantic-release/changelog'
  - '@semantic-release/git'

# Responsible for determining the type of the next release (major, minor or patch).
# If multiple plugins with a analyzeCommits step are defined, the release type will be
# the highest one among plugins output.
# Look details at: https://github.com/semantic-release/commit-analyzer#configuration
analyzeCommits:
  - path: '@semantic-release/commit-analyzer'
    releaseRules:
      - type: breaking  # Changes that break something makes something incompatible to ealier version
        release: major
      - type: build     # Changes that affect the build system or external dependencies
        release: false
      - type: chore     # Other changes that don't modify src or test files
        release: false
      - type: ci        # Changes to our CI configuration files and scripts
        release: false
      - type: docs      # Documentation only changes
        release: false
      - type: feat      # A new feature
        release: minor
      - type: fix       # A bug fix
        release: patch
      - type: perf      # A code change that improves performance
        release: patch
      - type: refactor  # A code change that neither fixes a bug nor adds a feature
        release: false
      - type: revert    # Reverts a previous commit
        release: patch
      - type: style     # Changes that do not affect the meaning of the code
        release: false
      - type: test      # Adding missing tests or correcting existing tests
        release: false

# Responsible for generating the content of the release note.
# If multiple plugins with a generateNotes step are defined,
# the release notes will be the result of the concatenation of each plugin output.
generateNotes:
  - path: '@semantic-release/release-notes-generator'
    writerOpts:
      groupBy: 'type'
      commitGroupsSort: 'title'
      commitsSort: 'header'
    linkCompare: true
    linkReferences: true
    presetConfig:
      types:  # looks like it only works with 'conventionalcommits' preset
        - type: 'build'
          section: '🦊 CI/CD'
          hidden: false
        - type: 'chore'
          section: 'Other'
          hidden: false
        - type: 'ci'
          section: '🦊 CI/CD'
          hidden: false
        - type: 'docs'
          section: '📔 Docs'
          hidden: false
        - type: 'example'
          section: '📝 Examples'
          hidden: false
        - type: 'feat'
          section: '🚀 Features'
          hidden: false
        - type: 'fix'
          section: '🛠 Fixes'
          hidden: false
        - type: 'perf'
          section: '⏩ Performance'
          hidden: false
        - type: 'refactor'
          section: ':scissors: Refactor'
          hidden: false
        - type: 'revert'
          section: '👀 Reverts'
          hidden: false
        - type: 'style'
          section: '💈 Style'
          hidden: false
        - type: 'test'
          section: '🧪 Tests'
          hidden: false

# Responsible for preparing the release, for example creating or updating files
# such as package.json, CHANGELOG.md, documentation or compiled assets
# and pushing a commit.
prepare:
  - path: '@semantic-release/changelog'
  - path: '@semantic-release/exec'
    # The chart appVersion is always set to the released operator version:
    # the chart's default image tag falls back to appVersion, so a stale
    # appVersion ships an operator binary mismatched with the chart and its
    # CRD. semantic-release substitutes the next release version into the
    # --set-version argument before the command runs.
    # The chart version moves with the appVersion on every stable (main)
    # release: the helm-chart workflow publishes a new chart package only
    # when Chart.yaml version changes, so an appVersion-only release would
    # otherwise leave Helm users on the old chart and its old default
    # operator image (chart-releaser skip_existing stays as idempotency
    # protection for re-runs). Prerelease releases (develop, e.g.
    # 1.19.1-develop.1) never publish a chart, so they are excluded from
    # the bump logic — which also removes the former git describe --tags
    # base-tag resolution whose result develop prerelease tags could
    # pollute on main (a merged prerelease tag shadows the last stable tag
    # and previously suppressed the bump on appVersion-only releases).
    cmd: |
      bash -c '
        set -e
        python3 -m pip install pybump
        # Always keep appVersion in sync with the released operator version.
        pybump set --file helm-chart/ssr-operator/Chart.yaml --app-version --set-version ${nextRelease.version}
        # Stable releases (main) always move appVersion, so they always bump
        # the chart patch version: the helm-chart workflow publishes a new
        # chart package only when Chart.yaml version changes, and an
        # appVersion-only release would otherwise leave Helm users on the
        # old chart and its old default operator image. chart-releaser
        # skip_existing keeps re-runs idempotent.
        # Prerelease releases (develop, e.g. 1.19.1-develop.1) never publish
        # a chart (the helm-chart workflow releases from main only), so
        # they are excluded here. This also removes the former git describe
        # --tags base-tag resolution, which develop prerelease tags could
        # pollute on main: a merged prerelease tag shadows the last stable
        # tag and previously suppressed the bump on appVersion-only
        # releases.
        case "${nextRelease.version}" in
          *-*)
            echo "Prerelease ${nextRelease.version}: the chart is published from main only; skipping Chart.yaml version bump"
            ;;
          *)
            pybump bump --file helm-chart/ssr-operator/Chart.yaml --level patch
            ;;
        esac
      '
  - path: '@semantic-release/git'
    message: "chore(release): ${nextRelease.version}"
    assets: ['CHANGELOG.md', 'helm-chart/ssr-operator/Chart.yaml']

publish:
  - path: '@semantic-release/npm'
    npmPublish: false

success: false

fail: false