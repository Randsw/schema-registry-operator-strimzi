{{- $namespaceScoped := .Values.rbac.namespaceScoped }}
{{- range .Values.cluster_roles }}
---
{{- /* Gate on the role's enabled flag too: a binding rendered while its
       role is disabled would reference a role that was never created and be
       rejected by the API server. Mirrors clusterrole.yaml: namespaced
       entries bind a Role via a RoleBinding in the release namespace, the
       rest stay ClusterRole/ClusterRoleBinding. */}}
{{- if and (eq .enabled true) (eq .cluster_role_binding true) }}
{{- $namespaced := and $namespaceScoped .namespaced }}
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ if $namespaced }}RoleBinding{{ else }}ClusterRoleBinding{{ end }}
metadata:
  labels:
    {{- include "ssr-operator.labels" $ | nindent 4 }}
  {{- /* Same name computation as clusterrole.yaml: cluster-scoped
         renderings embed the release namespace so two installs of the chart
         in different namespaces never collide. */}}
  name: {{ include "ssr-operator.rbacName" (dict "ctx" $ "name" .name "clusterScoped" (not $namespaced)) }}-binding
  {{- if $namespaced }}
  namespace: {{ $.Release.Namespace }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ if $namespaced }}Role{{ else }}ClusterRole{{ end }}
  name: {{ include "ssr-operator.rbacName" (dict "ctx" $ "name" .name "clusterScoped" (not $namespaced)) }}
subjects:
- kind: {{ .kind }}
  name: {{ include "ssr-operator.serviceAccountName" $ }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
