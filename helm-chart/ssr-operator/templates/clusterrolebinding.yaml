{{- $namespaceScoped := .Values.rbac.namespaceScoped }}
{{- range .Values.cluster_roles }}
---
{{- if eq .cluster_role_binding true }}
{{- /* Mirrors clusterrole.yaml: namespaced entries bind a Role via a
       RoleBinding in the release namespace, the rest stay
       ClusterRole/ClusterRoleBinding. */}}
{{- $namespaced := and $namespaceScoped .namespaced }}
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ if $namespaced }}RoleBinding{{ else }}ClusterRoleBinding{{ end }}
metadata:
  labels:
    {{- include "ssr-operator.labels" $ | nindent 4 }}
  name: {{ include "ssr-operator.name" $ }}-{{ .name }}-binding
  {{- if $namespaced }}
  namespace: {{ $.Release.Namespace }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ if $namespaced }}Role{{ else }}ClusterRole{{ end }}
  name: {{ include "ssr-operator.name" $ }}-{{ .name }}
subjects:
- kind: {{ .kind }}
  name: {{ include "ssr-operator.serviceAccountName" $ }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
