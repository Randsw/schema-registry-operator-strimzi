{{- range .Values.roles }}
---
{{- if eq .enabled true }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    {{- include "ssr-operator.labels" $ | nindent 4 }}
  {{- /* Namespaced Role: no namespace qualification needed. rolebinding.yaml
         must compute the same name for roleRef. */}}
  name: {{ include "ssr-operator.rbacName" (dict "ctx" $ "name" .name "clusterScoped" false) }}
rules:
{{ toYaml .rules }}
{{- end }}
{{- end }}