{{- range .Values.roles }}
---
{{- /* Gate on the role's enabled flag too: a binding rendered while its
       role is disabled would reference a role that was never created and be
       rejected by the API server. */}}
{{- if and (eq .enabled true) (eq .role_binding true) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    {{- include "ssr-operator.labels" $ | nindent 4 }}
  {{- /* Same name computation as role.yaml so roleRef always points at the
         role rendered by the same release. */}}
  name: {{ include "ssr-operator.rbacName" (dict "ctx" $ "name" .name "clusterScoped" false) }}-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ssr-operator.rbacName" (dict "ctx" $ "name" .name "clusterScoped" false) }}
subjects:
- kind: {{ .kind }}
  name: {{ include "ssr-operator.serviceAccountName" $ }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}