# Default values for cascadeAutoOperator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/randsw/strimzi-schema-registry-operator
  pullPolicy: Always
  # The image tag defaults to the chart appVersion (the operator version the
  # chart was released with). Override it here only to pin a different
  # operator build; avoid mutable tags such as "latest", which make an
  # install or a pod replacement run a binary mismatched with the chart and
  # its CRD.
  # tag: "1.17.0"
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi
  securityContext:
    allowPrivilegeEscalation: false
    # The operator needs no Linux capabilities (it only execs keytool/openssl
    # as child processes); dropping ALL satisfies the PSS restricted standard.
    capabilities:
      drop:
      - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

imagePullSecrets: []
nameOverride: "strimzi-schema-registry-operator"
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "strimzi-schema-registry-operator"

podAnnotations:
  kubectl.kubernetes.io/default-container: ssr-operator

podSecurityContext:
  runAsNonRoot: true
  # RuntimeDefault seccomp profile: required by the PSS restricted standard
  # (the operator image has no custom seccomp requirements).
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP

# Metrics endpoint configuration for the operator itself.
metrics:
  # When enabled, a Service exposing the operator metrics endpoint is created.
  enabled: true
  # When true the metrics endpoint is served via HTTPS with authn/authz
  # (requires a Prometheus setup that can authenticate). When false it is
  # served via plain HTTP, which is the practical default for in-cluster
  # Prometheus scraping.
  secure: false
  # Port the metrics endpoint binds to inside the operator container.
  port: 8080

terminationGracePeriodSeconds: 10

nodeSelector: {}

tolerations: []

affinity: {}

# RBAC scope for the operator (B21). When namespaceScoped is false (the
# default) the manager RBAC is rendered as ClusterRole/ClusterRoleBinding and
# the operator watches every namespace. When true, the manager RBAC is
# rendered as namespaced Role/RoleBinding in the release namespace and the
# operator watches only its own namespace (the chart injects WATCH_NAMESPACE,
# which the operator maps onto its manager cache). The proxy and
# metrics-reader roles stay cluster-scoped in both modes: TokenReview /
# SubjectAccessReview creation and non-resource /metrics access are not
# namespaced.
rbac:
  namespaceScoped: false

# RBAC Configuration for operator
cluster_roles:
  - enabled: true
    cluster_role_binding: true
    # namespaced is only effective when rbac.namespaceScoped is true: the
    # manager role is then rendered as a Role in the release namespace.
    namespaced: true
    name: "manager-role"
    kind: "ServiceAccount"
    labels: {}
    rules:
      # Operator events (Recorder.Eventf) are created in the CR's namespace,
      # which in the default cluster-scoped mode can be any namespace: the
      # manager role must grant events create/patch cluster-wide (mirrors
      # config/rbac/role.yaml).
      - apiGroups:
        - ""
        resources:
        - events
        verbs:
        - create
        - patch
      - apiGroups:
        - "apps"
        resources:
        - deployments
        verbs:
        - create
        - delete
        - get
        - list
        - patch
        - update
        - watch
      - apiGroups:
        - networking.k8s.io
        resources:
        - networkpolicies
        verbs:
        - create
        - delete
        - get
        - list
        - patch
        - update
        - watch
      - apiGroups:
        - strimziregistryoperator.randsw.code
        resources:
        - strimzischemaregistries
        verbs:
        - create
        - delete
        - get
        - list
        - patch
        - update
        - watch
      - apiGroups:
        - strimziregistryoperator.randsw.code
        resources:
        - strimzischemaregistries/finalizers
        verbs:
        - update
      - apiGroups:
        - strimziregistryoperator.randsw.code
        resources:
        - strimzischemaregistries/status
        verbs:
        - get
        - patch
        - update
      - apiGroups:
        - kafka.strimzi.io
        resources:
        - kafkausers
        - kafkas
        verbs:
        - get
        - list
        - watch
      - apiGroups:
        - ""
        resources:
        - secrets
        - services
        verbs:
        - create
        - delete
        - get
        - list
        - patch
        - update
        - watch
  - enabled: true
    name: "metrics-reader"
    cluster_role_binding: false
    # non-resource /metrics access is not namespaced: always cluster-scoped.
    namespaced: false
    kind: "ServiceAccount"
    labels: {}
    rules:
      - nonResourceURLs:
        - /metrics
        verbs:
          - get
  - enabled: true
    name: "proxy-role"
    cluster_role_binding: true
    # TokenReview/SubjectAccessReview creation is not namespaced: always
    # cluster-scoped.
    namespaced: false
    kind: "ServiceAccount"
    labels: {}
    rules:
      - apiGroups:
        - authentication.k8s.io
        resources:
        - tokenreviews
        verbs:
        - create
      - apiGroups:
        - authorization.k8s.io
        resources:
        - subjectaccessreviews
        verbs:
        - create

roles:
  - enabled: true
    name: "leader-election-role"
    kind: "ServiceAccount"
    role_binding: true
    labels: {}
    rules:
      - apiGroups:
        - ""
        resources:
        - configmaps
        verbs:
        - get
        - list
        - watch
        - create
        - update
        - patch
        - delete
      - apiGroups:
        - coordination.k8s.io
        resources:
        - leases
        verbs:
        - get
        - list
        - watch
        - create
        - update
        - patch
        - delete
      - apiGroups:
        - ""
        resources:
        - events
        verbs:
        - create
        - patch
