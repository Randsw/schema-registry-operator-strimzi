name: Lint, Test and Release Charts
on:
  push:
    branches:
      - 'develop'
      - 'feat/**'
      - 'fix/**'
      - 'cicd/**'
      - 'test/**'
      - 'main'
      - '[0-9]+-*'
    paths:
      - 'helm-chart/ssr-operator/**/*.yaml'
      - 'helm-chart/ssr-operator/**/*.tpl'
  pull_request:
    branches:
      - 'main'
    paths:
      - 'helm-chart/ssr-operator/**/*.yaml'
      - 'helm-chart/ssr-operator/**/*.tpl'
permissions:
  contents: write
jobs:
  Lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.SEMANTIC_TOKEN }}

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.11

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.9.0

      - name: Get changed files in the helm folder
        id: changed-files-helm-chart
        uses: tj-actions/changed-files@v47
        with:
          files_yaml: |
            helm:
              - helm-chart/ssr-operator/**/*.{yaml,tpl}
              - '!helm-chart/ssr-operator/Chart.yaml'

      - name: Run chart-testing (lint)
        run: ct lint --config ct.yaml --all
        if: steps.changed-files-helm-chart.outputs.helm_any_changed == 'true'

      - name: Create kind cluster
        uses: helm/kind-action@v1.15.1
        if: steps.changed-files-helm-chart.outputs.helm_any_changed == 'true'

      - name: Run chart-testing (install)
        run: ct install --config ct.yaml --all
        if: steps.changed-files-helm-chart.outputs.helm_any_changed == 'true'
  Release:
    runs-on: ubuntu-latest
    needs: Lint-test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.SEMANTIC_TOKEN }}

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Get changed files in the helm folder
        id: changed-files-helm-chart
        uses: tj-actions/changed-files@v47
        with:
          files_yaml: |
            helm:
              - helm-chart/ssr-operator/**/*.{yaml,tpl}
              - '!helm-chart/ssr-operator/Chart.yaml'
            chart_version:
              - 'helm-chart/ssr-operator/Chart.yaml'

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
            charts_dir: helm-chart
        env:
            CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        if: steps.changed-files-helm-chart.outputs.chart_version_any_changed == 'true' && github.ref == 'refs/heads/main'